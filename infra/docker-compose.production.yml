services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/hypka1/foodgram-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: foodgram_backend.settings_production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn foodgram_backend.wsgi:application
      --bind 0.0.0.0:8000
      "

  nginx:
    image: ghcr.io/hypka1/foodgram-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docs:/usr/share/nginx/html/api/docs:ro
      - static_data:/var/html/static:ro
      - media_data:/var/html/media:ro

volumes:
  postgres_data:
  static_data:
  media_data:
